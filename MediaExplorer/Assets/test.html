<!DOCTYPE html>
<html>
<head><title>Image Test</title></head>
<body style="font-family: sans-serif; padding: 20px;">
  <h1>Image Rendering Test</h1>
  
  <h2>1. External PNG</h2>
  <img src="https://www.wikipedia.org/portal/wikipedia.org/assets/img/Wikipedia-logo-v2.png" alt="Wikipedia Logo" width="135" height="155">
  
  <h2>2. External JPG</h2>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/300px-PNG_transparency_demonstration_1.png" alt="PNG Test" width="300">
  
  <h2>3. Data URI (1x1 red pixel)</h2>
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg==" alt="Red Pixel" width="50" height="50" style="image-rendering: pixelated;">
  
  <h2>4. Broken Image (should show placeholder)</h2>
  <img src="https://example.com/nonexistent.png" alt="Broken Image Test">
  
  <h2>5. Image with alt="Image" (should show [img] placeholder)</h2>
  <img src="https://example.com/also-broken.png" alt="Image">
  
  <h2>6. Inline image in text</h2>
  <p>This is a sentence with an inline <img src="https://www.wikipedia.org/portal/wikipedia.org/assets/img/Wikipedia-logo-v2.png" alt="Wiki" width="20" height="22"> image inside.</p>
</body>
</html>
